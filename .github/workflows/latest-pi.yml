name: Latest Pi compatibility

on:
  schedule:
    # Monthly on the 1st at 15:00 UTC (00:00 KST on the 2nd).
    - cron: "0 15 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Latest Pi compatibility on Modal
    # GitHub only dispatches work; installation and tests run on Modal.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install Modal SDK
        run: python -m pip install -r ci/requirements.txt
      - name: Install latest Pi and run compatibility checks on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [[ -z "$MODAL_TOKEN_ID" || -z "$MODAL_TOKEN_SECRET" ]]; then
            echo "::error::MODAL_TOKEN_ID and MODAL_TOKEN_SECRET must be set."
            exit 1
          fi
          modal run ci/modal_ci.py::run_tests
